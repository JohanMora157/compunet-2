<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <div th:fragment="sidebar" style="width: 220px; min-height: 100vh; background-color: #24292e; color: #f6f8fa; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
            <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid #444d56; padding-bottom: 10px;">Panel MVC</h3>
            <ul style="list-style: none; padding: 0; margin: 20px 0;">
                <li style="margin-bottom: 12px;">
                    <a th:href="@{/mvc/users}" style="color: #58a6ff; text-decoration: none; font-size: 16px;">👥 Usuarios</a>
                </li>
            </ul>
        </div>
        <div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" style="background-color: #d73a49; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;">
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

</body>
</html>
