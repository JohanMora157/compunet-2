<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit User</title>

    <link rel="stylesheet" th:href="@{/css/components/sidebar.css}">

    <link rel="stylesheet" th:href="@{/css/users/add.css}">
</head>

<body style="display: flex; margin: 0;">

    <div th:replace="~{components/sidebar :: sidebar}"></div>

    <div style="padding: 20px; flex: 1;">

        <h2>Edit User</h2>

        <div th:if="${actualUser == null}">
            <p>User not found.</p>
            <a th:href="@{/mvc/users}">Back to users list</a>
        </div>

        <div th:if="${actualUser != null}" class="form-container">

            <form th:action="@{/mvc/users/edit/{id}(id=${actualUser.id})}" method="post" th:object="${actualUser}">

                <input type="hidden" name="_method" value="put">

                <div class="form-group">
                    <label for="name">Name:</label>

                    <input type="text" id="name" name="name" maxlength="50" th:value="*{name}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>

                    <input type="email" id="email" name="email" maxlength="100" th:value="*{email}" required>
                </div>

                <div class="form-group">
                    <label for="password">New password:</label>

                    <input type="password" id="password" name="password" maxlength="255"
                        placeholder="Leave blank to keep current password">
                </div>

                <div class="form-group">
                    <label for="roleId">Role:</label>

                    <select id="roleId" name="roleId" required>

                        <option value="">Select a role</option>

                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"
                            th:selected="${actualUser.role != null and role.id == actualUser.role.id}">
                        </option>

                    </select>
                </div>

                <button type="submit">
                    Update User
                </button>

            </form>
        </div>

    </div>

</body>

</html>
